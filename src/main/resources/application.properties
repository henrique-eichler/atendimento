# Porta padrão para o backend de atendimento
server.port=8080
spring.datasource.url=jdbc:postgresql://100.64.64.201:5432/clinica
spring.datasource.username=clinica
spring.datasource.password=clinica
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configurações do Kafka (ajustadas para o IP correto da máquina com Kafka)
kafka.url=100.64.64.202:9092
# Nome do tópico Kafka para notificar que o áudio foi recebido
kafka.topico.transcrever=transcrever
kafka.topico.resumir=resumir
kafka.topico.extrair=extrair
# whisper url server
whisper.url=http://100.64.64.203:5001/transcrever
# the DeepSeek inference endpoint
deepseek.url=http://100.64.64.203:11434/api/generate
# redis url server
redis.url=redis://100.64.64.202:6379